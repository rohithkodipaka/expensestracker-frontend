<div class="dashboard" >
    <h2 style="color:green">Monthly Aggregates</h2>
    <p-chart 
        *ngIf="aggregates.length; else noData"
        [data]="pieChartData"
        [options]="pieChartOptions"
        type="pie">
    </p-chart>
  </div>

  <ng-template #noData>
        <p> No data available</p>
  </ng-template>
